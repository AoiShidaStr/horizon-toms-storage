# Tom's Simple Storage, the native half (docs/native-mods.md, "Trait mods").
#
# The launcher builds `api/` into the game and calls its `hooks()`. The mod is
# only a trait mod: no injections, so no Horizon source line is patched.
[mod]
id = "toms_storage"
version = "0.1.0"

# The Horizon revision this bundle was written and checked against.
[compatibility]
horizon_revision = "a85af177a82504f357ff10d5d40d0b7230e2ac32"

[api]
path = "api"
